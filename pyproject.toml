[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "underwater-sfm-degradation"
version = "0.1.0"
description = "Reproducible benchmark: how much does Jerlov underwater optics break structure-from-motion?"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Thiago Pari"}]
keywords = ["underwater", "sfm", "colmap", "sea-thru", "jerlov", "photogrammetry", "computer-vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Intended Audience :: Science/Research",
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:.*encountered in matmul:RuntimeWarning"]
testpaths = ["tests"]
python_files = ["test_*.py"]
